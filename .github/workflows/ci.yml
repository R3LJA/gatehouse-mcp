name: ci
on:
  push:
  pull_request:
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # the conformance suite is the ship gate: isolation, approvals, audit, both transports
      - run: npm test
      - run: npm run build
